<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Monopoly Bank</title>
    <meta name="description" content="Offline banking app for your board game night. No paper money." />
    <meta name="theme-color" content="#d7262b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bank" />
    <!-- Link previews (chat apps, social). Absolute URLs; the Pages workflow swaps in the deployed URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Monopoly Bank" />
    <meta property="og:title" content="Monopoly Bank" />
    <meta property="og:description" content="No more paper money. Offline bank for your board game night: one shared bank or a wallet per phone." />
    <meta property="og:url" content="https://monopoly.iliev.cz/" />
    <meta property="og:image" content="https://monopoly.iliev.cz/og-image.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Monopoly Bank app on three phones" />
    <meta name="twitter:card" content="summary_large_image" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preload" href="fonts/archivo-black-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="splash">
            <div class="logo-box"><span>MONOPOLY</span><small>BANK</small></div>
            <div class="splash-bar"><i></i></div>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        <span>Oops! Something went wrong.</span>
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
